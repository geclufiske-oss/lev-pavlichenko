<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Портфолио</title><style>body{margin:0;background:#faf4ec;color:#58152b;font:18px/1.5 system-ui}p{max-width:32em;margin:15vh auto;padding:24px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#faf4ec}</style><p id="status" role="status">Откройте полную ссылку из сообщения.</p><script>
async function showPortfolio(){
 const fragment=location.hash.slice(1);
 if(!/^[A-Za-z0-9_-]{43}$/.test(fragment))return;
 const status=document.getElementById('status');
 status.textContent='Открываем портфолио…';
 try{
 const bytes=Uint8Array.from(atob(fragment.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',bytes,'AES-GCM',false,['decrypt']);
 const response=await fetch('./portfolio.bin');
 if(!response.ok)throw Error();
 const data=new Uint8Array(await response.arrayBuffer());
 const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
 const frame=document.createElement('iframe');
 frame.title='Портфолио Льва';
 frame.srcdoc=new TextDecoder().decode(html).replace('<head>','<head><base href="about:srcdoc">');
 document.body.replaceChildren(frame);
 }catch{status.textContent='Не удалось открыть портфолио. Проверьте соединение и скопируйте ссылку целиком.'}
}showPortfolio();</script></html>
